{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 2rem auto; text-align: center;">
    <h2><i data-lucide="mail-check"></i> Confirmar E-mail</h2>
    <p style="color: var(--text-muted); font-size: 0.88rem; margin: 0.5rem 0 1.5rem 0;">
        Enviamos um código de 6 dígitos para <strong style="color: var(--text);">{{ email }}</strong>.
    </p>

    <form method="POST" action="{{ url_for('verificar_email') }}">
        <div class="form-group">
            <input type="text" 
                   name="code" 
                   maxlength="6" 
                   pattern="[0-9]{6}" 
                   placeholder="000000" 
                   required 
                   style="font-size: 1.8rem; letter-spacing: 8px; text-align: center; font-family: monospace;">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
            Verificar Código
        </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
        <form method="POST" action="{{ url_for('reenviar_codigo') }}">
            <button type="submit" class="btn-link" style="font-size: 0.85rem;">
                Não recebeu? Reenviar novo código
            </button>
        </form>
    </div>
</div>
{% endblock %}
