{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2>Criar Nova Senha</h2>
    <br>
    <form method="POST" action="{{ url_for('redefinir_senha', token=token) }}">
        <div class="form-group">
            <label>Nova Senha</label>
            <input type="password" name="password" required minlength="6" placeholder="Mínimo de 6 caracteres">
        </div>
        <div class="form-group">
            <label>Confirmar Nova Senha</label>
            <input type="password" name="confirm_password" required minlength="6" placeholder="Repita a nova senha">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Redefinir Senha</button>
    </form>
</div>
{% endblock %}
