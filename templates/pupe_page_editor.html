{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2><i data-lucide="layout"></i> Editor da Pupe Page</h2>
    <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.25rem;">
        Crie a sua mini página personalizada com HTML e CSS. Tamanho máximo: 20 KB. (Atributos de Script e JS são automaticamente removidos por segurança).
    </p>
    <br>

    <form method="POST">
        <div class="form-group">
            <label>Código HTML + CSS Inline</label>
            <textarea name="html_content" rows="12" style="font-family: monospace; font-size: 0.85rem;" placeholder="<div style='text-align:center;'><h1>A minha página Pupe!</h1></div>">{{ page.html_content if page else html_content or '' }}</textarea>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button type="submit" class="btn-primary"><i data-lucide="save"></i> Guardar e Publicar</button>
            {% if current_user %}
            <a href="{{ url_for('ver_pupe_page', username=current_user.username) }}" target="_blank" class="btn-secondary"><i data-lucide="external-link"></i> Visualizar Página</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
