{% extends "base.html" %}

{% block content %}
<h2>Notificações</h2>
<br>
<div class="notifications-list">
    {% for notif in notifications %}
    <div class="card" style="display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem;">
        <img src="{{ notif.avatar_url or '/static/default-avatar.png' }}" class="avatar-sm" alt="Avatar">
        <div>
            <p><strong>@{{ notif.username }}</strong> {{ notif.message }}</p>
            <span style="font-size: 0.75rem; color: var(--text-muted);">{{ notif.created_at }}</span>
        </div>
    </div>
    {% else %}
    <p style="color: var(--text-muted);">Você não tem notificações recentes.</p>
    {% endfor %}
</div>
{% endblock %}
