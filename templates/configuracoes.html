{% extends "base.html" %}

{% block content %}
<div style="max-width: 550px; margin: 0 auto;">
    <h2>Configurações da Conta</h2>
    <br>

    <!-- Foto de Perfil -->
    <div class="card">
        <h3>Foto de Perfil</h3>
        <br>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <img src="{{ user.avatar_url or '/static/default-avatar.png' }}" class="avatar-lg" alt="Avatar">
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="update_avatar">
                <div class="form-group">
                    <input type="file" name="avatar" accept="image/*" required>
                </div>
                <button type="submit" class="btn-primary btn-sm">Salvar Nova Foto</button>
            </form>
        </div>
    </div>

    <!-- Informações Públicas -->
    <div class="card">
        <h3>Informações do Perfil</h3>
        <br>
        <form method="POST">
            <input type="hidden" name="action" value="update_profile">
            <div class="form-group">
                <label>Nome de Exibição</label>
                <input type="text" name="display_name" value="{{ user.display_name or user.username }}">
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" rows="3">{{ user.bio or '' }}</textarea>
            </div>
            <button type="submit" class="btn-primary">Atualizar Perfil</button>
        </form>
    </div>

    <!-- Alteração de Senha -->
    <div class="card">
        <h3>Alterar Senha</h3>
        <br>
        <form method="POST">
            <input type="hidden" name="action" value="change_password">
            <div class="form-group">
                <label>Senha Atual</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>Nova Senha</label>
                <input type="password" name="new_password" required minlength="6">
            </div>
            <button type="submit" class="btn-primary">Alterar Senha</button>
        </form>
    </div>
</div>
{% endblock %}
