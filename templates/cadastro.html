{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2>Criar Conta</h2>
    <br>
    <form method="POST">
        <div class="form-group">
            <label>Nome de Usuário (@username)</label>
            <input type="text" name="username" required pattern="[a-zA-Z0-9_]+" title="Apenas letras, números e underline">
        </div>
        <div class="form-group">
            <label>Nome de Exibição</label>
            <input type="text" name="display_name" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Cadastrar</button>
    </form>
</div>
{% endblock %}
