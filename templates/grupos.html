{% extends "base.html" %}

{% block content %}
<h2>Grupos</h2>
<br>

{% if current_user %}
<div class="card">
    <h3>Criar Novo Grupo</h3>
    <br>
    <form action="{{ url_for('criar_grupo') }}" method="POST">
        <div class="form-group">
            <label>Nome do Grupo</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <textarea name="description" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-primary">Criar Grupo</button>
    </form>
</div>
{% endif %}

<div class="groups-list">
    {% for group in groups %}
    <div class="card">
        <h3>{{ group.name }}</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">{{ group.description or 'Sem descrição.' }}</p>
    </div>
    {% else %}
    <p style="color: var(--text-muted);">Nenhum grupo cadastrado ainda.</p>
    {% endfor %}
</div>
{% endblock %}
